name: One-off Matsumoto male
on:
  push:
    branches: [season/2026-27]
    paths: [.github/workflows/one-off-matsumoto-male.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
      - run: |
          python3 - <<'PY'
          import json
          p='data/seasons/2026-27/players.json'
          d=json.load(open(p,encoding='utf-8'))
          x=next(i for i in d if i['id']=='ka26-43')
          x['gender']='男'
          assert x['nationality']=='日本'
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          open(p,'a',encoding='utf-8').write('\n')
          PY
          rm .github/workflows/one-off-matsumoto-male.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/seasons/2026-27/players.json .github/workflows/one-off-matsumoto-male.yml
          git commit -m "Set Matsumoto Yosuke gender"
          git push origin HEAD:season/2026-27
