name: One-off sync Black Knights from registration sheet

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/oneoff-sync-black-knights-excel.yml

permissions:
  contents: write

jobs:
  sync-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout season branch
        uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0

      - name: Sync Kaohsiung Black Knights roster from official sheet
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'data/seasons/2026-27/players.json';
          const teamId = 't_kaohsiung_black_knights_2026';
          const ageReferenceDate = '2026-11-01';
          const players = JSON.parse(fs.readFileSync(file, 'utf8'));

          const ageOnDate = (birthDate, referenceDate) => {
            const [by, bm, bd] = birthDate.split('-').map(Number);
            const [ry, rm, rd] = referenceDate.split('-').map(Number);
            let age = ry - by;
            if (rm < bm || (rm === bm && rd < bd)) age -= 1;
            return age;
          };

          const makePlayer = ({ id, identityId, number, name, englishName, gender, nationality, birthDate }) => ({
            id,
            identityId,
            teamId,
            number,
            name,
            englishName,
            gender,
            nationality,
            age: ageOnDate(birthDate, ageReferenceDate),
            birthDate
          });

          const roster = [
            makePlayer({ id: 'kbk26-01', identityId: 'l-joel-vega-v', number: 10, name: 'Joel Vega', englishName: 'L. JOEL VEGA V', gender: '男', nationality: '尼加拉瓜', birthDate: '1989-10-30' }),
            makePlayer({ id: 'kbk26-02', identityId: 'wang-jia-wei', number: 17, name: '王家偉', englishName: 'WANG JIA WEI', gender: '男', nationality: '台灣', birthDate: '1991-12-24' }),
            makePlayer({ id: 'kbk26-03', identityId: 'michael-stein-lenihan', number: 16, name: 'MICHAEL LENIHAN', englishName: 'MICHAEL STEIN LENIHAN', gender: '男', nationality: '愛爾蘭', birthDate: '1987-03-31' }),
            makePlayer({ id: 'kbk26-04', identityId: 'patrick-bryan-haines', number: 36, name: 'PATRICK HAINES', englishName: 'PATRICK BRYAN HAINES', gender: '男', nationality: '美國', birthDate: '1988-03-02' }),
            makePlayer({ id: 'kbk26-05', identityId: 'charles-nwangi-njoroge', number: 26, name: 'CHARLES NWANGI', englishName: 'CHARLES NWANGI NJOROGE', gender: '男', nationality: '肯亞', birthDate: '1989-08-02' }),
            makePlayer({ id: 'kbk26-06', identityId: 'hlandze-likhwa-lethu', number: 4, name: 'LIKHWA', englishName: 'HLANDZE LIKHWA LETHU', gender: '男', nationality: '史瓦帝尼', birthDate: '1999-08-12' }),
            makePlayer({ id: 'kbk26-07', identityId: 'ahmed-nadeem-khaleel-kandouri', number: 79, name: 'ALI', englishName: 'AHMED NADEEM KHALEEL KANDOURI', gender: '男', nationality: '伊拉克', birthDate: '1989-02-05' }),
            makePlayer({ id: 'kbk26-08', identityId: 'lucas-matias-roa-espinola', number: 29, name: 'LUCAS ROA', englishName: 'Lucas Matias Roa Espinola', gender: '男', nationality: '巴拉圭', birthDate: '2002-11-07' }),
            makePlayer({ id: 'kbk26-13', identityId: 'douglas-alexander-alfaro', number: 35, name: 'DOUGLAS', englishName: 'DOUGLAS ALEXANDER ALFARO', gender: '男', nationality: '薩爾瓦多', birthDate: '1994-10-17' }),
            makePlayer({ id: 'kbk26-09', identityId: 'lian-yu-xiang', number: 11, name: '連于翔', englishName: 'LIAN YU XIANG', gender: '男', nationality: '台灣', birthDate: '2010-04-09' }),
            makePlayer({ id: 'kbk26-10', identityId: 'huang-yen-pu', number: 30, name: '黃衍普', englishName: 'HUANG YEN PU', gender: '男', nationality: '台灣', birthDate: '2009-11-06' }),
            makePlayer({ id: 'kbk26-11', identityId: 'manongi-dickson', number: 7, name: 'DICKSON', englishName: 'MANONGI DICKSON', gender: '男', nationality: '索羅門群島', birthDate: '1993-07-10' }),
            makePlayer({ id: 'kbk26-12', identityId: 'chiang-pin', number: 2, name: '姜斌', englishName: 'CHIANG PIN', gender: '男', nationality: '台灣', birthDate: '2005-02-16' })
          ];

          const indexes = players
            .map((player, index) => player.teamId === teamId ? index : -1)
            .filter((index) => index >= 0);
          if (indexes.length !== 13) {
            throw new Error(`Expected 13 Black Knights players, found ${indexes.length}`);
          }
          const first = Math.min(...indexes);
          const last = Math.max(...indexes);
          if (last - first + 1 !== indexes.length) {
            throw new Error('Black Knights roster is not contiguous; refusing unsafe replacement');
          }

          const next = [...players.slice(0, first), ...roster, ...players.slice(last + 1)];
          fs.writeFileSync(file, `${JSON.stringify(next, null, 2)}\n`);

          const stored = next.filter((player) => player.teamId === teamId);
          for (const player of stored) {
            const recomputed = ageOnDate(player.birthDate, ageReferenceDate);
            if (player.age !== recomputed) {
              throw new Error(`Age mismatch for ${player.name}: ${player.age} vs ${recomputed}`);
            }
          }
          console.log(`Synced ${stored.length} Black Knights players; ages calculated on ${ageReferenceDate}.`);
          NODE

      - name: Remove one-off workflow and commit roster
        shell: bash
        run: |
          rm .github/workflows/oneoff-sync-black-knights-excel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seasons/2026-27/players.json .github/workflows/oneoff-sync-black-knights-excel.yml
          git commit -m "Sync Black Knights roster from registration sheet"
          git push origin HEAD:season/2026-27
