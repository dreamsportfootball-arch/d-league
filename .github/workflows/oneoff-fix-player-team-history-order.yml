name: One-off fix player team history order

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/oneoff-fix-player-team-history-order.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix newest-first same-season team history
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pages/PlayerPage.tsx')
          text = path.read_text()
          old = '  timeline.sort((a, b) => a.timestamp - b.timestamp);'
          new = '  timeline.sort((a, b) => b.timestamp - a.timestamp);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target sort, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Verify targeted source change
        shell: bash
        run: |
          grep -F "timeline.sort((a, b) => b.timestamp - a.timestamp);" pages/PlayerPage.tsx
          git diff --check
          git diff -- pages/PlayerPage.tsx
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Validate season data
        run: npm run validate:data
      - name: Build production site
        run: npm run build
      - name: Remove one-off workflows and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/oneoff-audit-player-team-history-order.yml
          rm -f .github/workflows/oneoff-fix-player-team-history-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/PlayerPage.tsx .github/workflows/oneoff-audit-player-team-history-order.yml .github/workflows/oneoff-fix-player-team-history-order.yml
          git commit -m "Fix player team history chronology"
          git push origin HEAD:season/2026-27
