name: One-off scroll cleanup key fix

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/oneoff-fix-scroll-cleanup-key.yml
      - scripts/oneoff-fix-scroll-cleanup-key.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/oneoff-fix-scroll-cleanup-key.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix route-scoped scroll cleanup write"
          git push origin HEAD:season/2026-27
