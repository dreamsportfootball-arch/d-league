name: One-off audit player team history order

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/oneoff-audit-player-team-history-order.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all player same-season team histories
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const seasonIds = ['2025-26', '2026-27'];
          let totalPlayers = 0;
          let multiTeamPlayers = 0;

          const read = (seasonId, file) => JSON.parse(
            fs.readFileSync(path.join('data', 'seasons', seasonId, file), 'utf8')
          );

          for (const seasonId of seasonIds) {
            const players = read(seasonId, 'players.json');
            const teams = read(seasonId, 'teams.json');
            const matches = read(seasonId, 'matches.json');
            const lineups = read(seasonId, 'lineups.json');
            const matchEvents = read(seasonId, 'matchEvents.json');
            const playerImages = read(seasonId, 'playerImages.json');
            const teamMap = Object.fromEntries(teams.map((team) => [team.id, team]));
            const matchMap = Object.fromEntries(matches.map((match) => [match.id, match]));

            const resolveEventPlayer = (match, event) => {
              const explicitId = event.playerId ?? event.subjectId;
              if (explicitId) return players.find((candidate) => candidate.id === explicitId);
              const eventTeamId = event.team === 'HOME' ? match.homeTeamId : match.awayTeamId;
              const candidates = players.filter((candidate) => candidate.name === event.player);
              return candidates.find((candidate) => candidate.teamId === eventTeamId) ??
                (candidates.length === 1 ? candidates[0] : undefined);
            };

            for (const player of players) {
              totalPlayers += 1;
              const timeline = [];
              const addTeam = (teamId, timestamp, source) => {
                if (!teamId || !teamMap[teamId]) return;
                timeline.push({ teamId, timestamp, source });
              };

              for (const registration of player.registrations ?? []) {
                addTeam(registration.teamId, new Date(registration.effectiveFrom).getTime(), 'registration');
              }

              const playerImage = playerImages[player.name];
              if (playerImage) {
                const parts = playerImage.split('/').filter(Boolean);
                const imageTeamName = parts[parts.length - 2];
                const imageTeam = teams.find(
                  (team) => team.name === imageTeamName || team.shortName === imageTeamName
                );
                if (imageTeam) addTeam(imageTeam.id, Number.NEGATIVE_INFINITY, 'image');
              }

              for (const [matchId, lineup] of Object.entries(lineups)) {
                const match = matchMap[matchId];
                if (!match || !lineup || typeof lineup !== 'object') continue;
                const homeIds = Array.isArray(lineup.homePlayerIds) ? lineup.homePlayerIds : [];
                const awayIds = Array.isArray(lineup.awayPlayerIds) ? lineup.awayPlayerIds : [];
                const timestamp = new Date(match.timestamp).getTime();
                if (homeIds.includes(player.id)) addTeam(match.homeTeamId, timestamp, 'lineup');
                if (awayIds.includes(player.id)) addTeam(match.awayTeamId, timestamp, 'lineup');
              }

              for (const [matchId, events] of Object.entries(matchEvents)) {
                const match = matchMap[matchId];
                if (!match || !Array.isArray(events)) continue;
                const timestamp = new Date(match.timestamp).getTime();
                for (const event of events) {
                  if (resolveEventPlayer(match, event)?.id !== player.id) continue;
                  addTeam(event.team === 'HOME' ? match.homeTeamId : match.awayTeamId, timestamp, 'event');
                }
              }

              addTeam(player.teamId, Number.POSITIVE_INFINITY, 'current-teamId');

              const uniqueTeams = (direction) => {
                const sorted = [...timeline].sort((a, b) =>
                  direction === 'asc' ? a.timestamp - b.timestamp : b.timestamp - a.timestamp
                );
                const seen = new Set();
                return sorted.filter(({ teamId }) => {
                  if (seen.has(teamId)) return false;
                  seen.add(teamId);
                  return true;
                });
              };

              const current = uniqueTeams('asc');
              const expected = uniqueTeams('desc');
              if (current.length <= 1) continue;
              multiTeamPlayers += 1;

              const names = (items) => items.map(({ teamId }) => teamMap[teamId].name).join(' > ');
              const sources = timeline
                .map(({ teamId, timestamp, source }) => `${teamMap[teamId].name}@${String(timestamp)}:${source}`)
                .join(' | ');
              console.log(`AFFECTED|${seasonId}|${player.name}|${player.id}|current=${names(current)}|expected=${names(expected)}|evidence=${sources}`);
            }
          }

          console.log(`SUMMARY|players=${totalPlayers}|multiTeamPlayers=${multiTeamPlayers}`);
          NODE
